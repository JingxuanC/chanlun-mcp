[workspace]
resolver = "3"
members = [
    "crates/chanlun-core",
    "crates/chanlun-data",
    "crates/chanlun-engine",
    "crates/chanlun-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
